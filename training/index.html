<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>デリバリー営業 知識テスト｜トナリビズ</title>
<meta name="theme-color" content="#2B2A4C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#2B2A4C;--navy2:#3B3A63;--cyan:#3BB8D8;--cyan-l:#E8F7FB;--ink:#17171C;--ink2:#4E4E57;--mute:#8D8B88;--line:#E8E4DD;--bg:#F7F5F1;--ok:#14A35A;--ok-l:#E9F8EF;--ng:#E5484D;--ng-l:#FDECEC;
--g:"Zen Kaku Gothic New",system-ui,sans-serif;--l:"Inter Tight","Zen Kaku Gothic New",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--g);color:var(--ink);background:var(--bg);font-feature-settings:"palt";-webkit-font-smoothing:antialiased;line-height:1.7;min-height:100svh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hd{background:var(--navy);color:#fff}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.hd .t{font-weight:900;font-size:15px;letter-spacing:.04em}
.hd .t small{display:block;font-family:var(--l);font-size:10px;letter-spacing:.24em;opacity:.7;font-weight:700}
.hd img{height:26px;filter:brightness(0) invert(1)}
.view{display:none;padding:32px 0 120px}
.view.on{display:block;animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}

/* intro */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:32px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(59,184,216,.18)}
.hero .lab{font-family:var(--l);font-size:11px;font-weight:700;letter-spacing:.26em;color:var(--cyan)}
.hero h1{margin-top:10px;font-size:clamp(26px,6vw,34px);font-weight:900;line-height:1.35;position:relative}
.hero p{margin-top:12px;font-size:14px;opacity:.88;position:relative}
.rules{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.rules div{background:rgba(255,255,255,.08);border-radius:14px;padding:12px;text-align:center}
.rules b{display:block;font-family:var(--l);font-size:22px;font-weight:900}
.rules small{font-size:11px;opacity:.8}
.card{background:#fff;border-radius:20px;padding:24px;margin-top:16px;border:1px solid var(--line)}
.card h2{font-size:16px;font-weight:900}
.field{margin-top:12px;width:100%;font:inherit;font-size:17px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;outline:none;transition:border-color .2s}
.field:focus{border-color:var(--cyan)}
.tests{margin-top:12px;display:grid;gap:10px}
.test{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);border-radius:16px;padding:16px;transition:border-color .2s,background .2s}
.test .n{flex:none;width:44px;height:44px;border-radius:12px;background:var(--cyan-l);color:var(--navy);display:flex;align-items:center;justify-content:center;font-family:var(--l);font-weight:900;font-size:18px}
.test b{display:block;font-weight:900}
.test small{color:var(--ink2);font-size:13px}
.test[aria-pressed="true"]{border-color:var(--navy);background:#F3F3F8}
.test[aria-pressed="true"] .n{background:var(--navy);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:16px;letter-spacing:.06em;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sub{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.note{margin-top:12px;font-size:12px;color:var(--mute);text-align:center}

/* quiz */
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);font-weight:700}
.prog .row b{font-family:var(--l);font-size:20px;color:var(--ink)}
.bar{margin-top:8px;height:8px;border-radius:4px;background:#E6E2DA;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--navy));border-radius:4px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.dots{margin-top:10px;display:flex;gap:4px;flex-wrap:wrap}
.dots button{width:22px;height:22px;border-radius:6px;background:#E6E2DA;font-family:var(--l);font-size:10px;font-weight:800;color:var(--ink2)}
.dots button.a{background:var(--cyan-l);color:var(--navy)}
.dots button.cur{background:var(--navy);color:#fff}
.q{margin-top:8px}
.q .num{font-family:var(--l);font-weight:900;color:var(--cyan);letter-spacing:.1em;font-size:13px}
.q h2{margin-top:6px;font-size:clamp(19px,4.6vw,22px);font-weight:900;line-height:1.6}
.opts{margin-top:18px;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;font-size:15.5px;font-weight:500;line-height:1.6;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--l);font-weight:900;font-size:13px;color:var(--ink2);margin-top:-1px}
.opt[aria-checked="true"]{border-color:var(--navy);background:#F3F3F8}
.opt[aria-checked="true"] .k{background:var(--navy);border-color:var(--navy);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(247,245,241,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:10;display:none}
.nav.on{display:block}
.nav .wrap{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* loading */
.load{text-align:center;padding:80px 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #E6E2DA;border-top-color:var(--navy);margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load p{margin-top:16px;font-weight:700;color:var(--ink2)}

/* result */
.score{border-radius:24px;padding:30px 26px;color:#fff;text-align:center;position:relative;overflow:hidden}
.score.pass{background:linear-gradient(135deg,#14A35A,#0E7C44)}
.score.fail{background:linear-gradient(135deg,var(--navy),var(--navy2))}
.score .who{font-size:13px;opacity:.85}
.score .v{margin-top:6px;font-family:var(--l);font-weight:900;font-size:72px;line-height:1;letter-spacing:-.04em}
.score .v span{font-size:24px;opacity:.75;margin-left:4px}
.score .badge{display:inline-block;margin-top:12px;background:#fff;border-radius:999px;padding:6px 18px;font-weight:900;font-size:15px;letter-spacing:.1em}
.score.pass .badge{color:var(--ok)}
.score.fail .badge{color:var(--ng)}
.score p{margin-top:12px;font-size:13.5px;opacity:.9}
.sumrow{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sumrow div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.sumrow b{display:block;font-family:var(--l);font-size:26px;font-weight:900}
.sumrow small{font-size:12px;color:var(--ink2)}
.sec{margin-top:28px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--navy)}
.sec.ng::before{background:var(--ng)}.sec.ok::before{background:var(--ok)}
.rv{margin-top:12px;background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px}
.rv .h{display:flex;gap:10px;align-items:flex-start}
.rv .mk{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px}
.rv.ok .mk{background:var(--ok)}.rv.ng .mk{background:var(--ng)}
.rv .qt{font-weight:900;line-height:1.6}
.rv .qt small{display:block;font-family:var(--l);font-size:11px;color:var(--mute);letter-spacing:.1em}
.rv ul{list-style:none;margin-top:12px;display:grid;gap:6px}
.rv li{font-size:14px;padding:9px 12px;border-radius:10px;background:var(--bg);display:flex;gap:8px;line-height:1.55}
.rv li .k{font-family:var(--l);font-weight:900;color:var(--mute)}
.rv li.c{background:var(--ok-l);color:#0B6B39;font-weight:700}
.rv li.c .k{color:var(--ok)}
.rv li.y{background:var(--ng-l);color:#A3262A;font-weight:700}
.rv li.y .k{color:var(--ng)}
.rv li .tg{margin-left:auto;flex:none;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:#fff;align-self:center}
.rv .ex{margin-top:12px;font-size:14px;line-height:1.75;color:var(--ink2);border-left:3px solid var(--cyan);padding:2px 0 2px 12px}
.rv .ex b{color:var(--ink)}
.acts{margin-top:28px;display:grid;gap:10px}
.err{margin-top:16px;background:var(--ng-l);color:#A3262A;border-radius:14px;padding:14px;font-size:14px;font-weight:700;display:none}
.err.on{display:block}
.ft{text-align:center;font-size:11px;color:var(--mute);padding:24px 0}
</style>
</head>
<body>
<header class="hd"><div class="wrap"><div class="t"><small>TRAINING</small>デリバリー営業 知識テスト</div><img src="../assets/logo_1.svg" alt="Tonari Biz"></div></header>

<main class="wrap">
  <!-- intro -->
  <section class="view on" id="v-intro">
    <div class="hero">
      <p class="lab">TONARI BIZ — DELIVERY SALES</p>
      <h1>デリバリー営業<br>知識テスト</h1>
      <p>ロケットナウ・Uber Eats・出前館の営業に必要な知識を確認します。全問回答すると、点数と全問の解説が表示されます。</p>
      <div class="rules"><div><b>20</b><small>問（1問2点）</small></div><div><b>40</b><small>点満点</small></div><div><b>40</b><small>点のみ合格</small></div></div>
    </div>
    <div class="card">
      <h2>お名前</h2>
      <input class="field" id="name" type="text" autocomplete="name" placeholder="例）山田 太郎" maxlength="40">
    </div>
    <div class="card">
      <h2>受けるテストを選んでください</h2>
      <div class="tests" id="tests"></div>
    </div>
    <div style="margin-top:20px"><button class="btn" id="start" disabled>テストを始める</button></div>
    <p class="note">満点（40点）のみ合格です。何度でも受け直せます。</p>
  </section>

  <!-- quiz -->
  <section class="view" id="v-quiz">
    <div class="prog">
      <div class="row"><span id="qtitle"></span><span><b id="qno">1</b> / <span id="qmax">20</span></span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="q"><p class="num" id="qnum">QUESTION 01</p><h2 id="qtext"></h2><div class="opts" id="opts" role="radiogroup"></div></div>
    <div class="err" id="err"></div>
  </section>

  <!-- loading -->
  <section class="view" id="v-load"><div class="load"><div class="spin"></div><p>採点しています…</p></div></section>

  <!-- result -->
  <section class="view" id="v-result">
    <div class="score" id="score"><p class="who" id="rwho"></p><div class="v" id="rv"></div><span class="badge" id="rbadge"></span><p id="rmsg"></p></div>
    <div class="sumrow"><div><b id="rok" style="color:var(--ok)"></b><small>正解</small></div><div><b id="rng" style="color:var(--ng)"></b><small>不正解</small></div></div>
    <div id="rlist"></div>
    <div class="acts"><button class="btn" id="retry">もう一度受ける</button><button class="btn sub" id="home">テスト選択に戻る</button></div>
  </section>
</main>
<p class="ft">株式会社トナリビズ　社内研修用</p>

<nav class="nav" id="nav"><div class="wrap"><button class="btn sub" id="prev">戻る</button><button class="btn" id="next" disabled>次へ</button></div></nav>

<script src="questions.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var Q=window.QUIZ, $=function(id){return document.getElementById(id)}, K=['A','B','C','D'];
  var st={test:null,name:'',i:0,ans:[]};
  var DESC={t1:'商材知識・店舗向け条件・トーク',t2:'受注書類・受注ルール'};
  try{st.name=localStorage.getItem('quiz_name')||''}catch(e){}
  $('name').value=st.name;

  // tests
  Object.keys(Q).forEach(function(k,ix){
    var b=document.createElement('button');b.className='test';b.setAttribute('aria-pressed','false');b.dataset.k=k;
    b.innerHTML='<span class="n">'+(ix+1)+'</span><span><b>'+esc(Q[k].title)+'</b><small>'+DESC[k]+'／全'+Q[k].qs.length+'問</small></span>';
    b.onclick=function(){st.test=k;[].forEach.call(document.querySelectorAll('.test'),function(x){x.setAttribute('aria-pressed',x===b)});chk()};
    $('tests').appendChild(b);
  });
  $('name').oninput=chk;
  function chk(){$('start').disabled=!($('name').value.trim()&&st.test)}
  $('start').onclick=function(){
    st.name=$('name').value.trim();try{localStorage.setItem('quiz_name',st.name)}catch(e){}
    begin();
  };
  function begin(){
    var t=Q[st.test];st.i=0;st.ans=new Array(t.qs.length).fill(null);
    $('qtitle').textContent=t.title;$('qmax').textContent=t.qs.length;
    $('dots').innerHTML='';t.qs.forEach(function(_,i){var d=document.createElement('button');d.textContent=i+1;d.setAttribute('aria-label','問'+(i+1));d.onclick=function(){st.i=i;render()};$('dots').appendChild(d)});
    show('v-quiz');$('nav').classList.add('on');render();
  }
  function render(){
    var t=Q[st.test],q=t.qs[st.i],n=t.qs.length;
    $('qno').textContent=st.i+1;$('qnum').textContent='QUESTION '+String(st.i+1).padStart(2,'0');$('qtext').textContent=q.q;
    var done=st.ans.filter(function(a){return a!==null}).length;$('bar').style.width=(done/n*100)+'%';
    [].forEach.call($('dots').children,function(d,i){d.className=(i===st.i?'cur':(st.ans[i]!==null?'a':''))});
    $('opts').innerHTML='';
    q.c.forEach(function(c,ci){var o=document.createElement('button');o.className='opt';o.setAttribute('role','radio');o.setAttribute('aria-checked',st.ans[st.i]===ci);
      o.innerHTML='<span class="k">'+K[ci]+'</span><span>'+esc(c)+'</span>';
      o.onclick=function(){st.ans[st.i]=ci;render();if(st.i<n-1){setTimeout(function(){st.i++;render();scrollTo({top:0,behavior:'smooth'})},260)}};
      $('opts').appendChild(o)});
    $('prev').disabled=st.i===0;
    var last=st.i===n-1,all=done===n;
    $('next').textContent=last||all?(all?'回答を送信して採点する':'未回答の問題があります'):'次へ';
    $('next').disabled=(last||all)?!all:st.ans[st.i]===null;
  }
  $('prev').onclick=function(){if(st.i>0){st.i--;render()}};
  $('next').onclick=function(){
    var n=Q[st.test].qs.length,all=st.ans.every(function(a){return a!==null});
    if(all&&(st.i===n-1||true)&&$('next').textContent.indexOf('送信')>=0){submit();return}
    if(st.i<n-1){st.i++;render();scrollTo({top:0,behavior:'smooth'})}
  };
  function submit(){
    $('nav').classList.remove('on');show('v-load');$('err').classList.remove('on');
    fetch(window.QUIZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({test:st.test,name:st.name,answers:st.ans})})
      .then(function(r){return r.json()}).then(function(d){if(d.error)throw new Error(d.error);result(d)})
      .catch(function(e){show('v-quiz');$('nav').classList.add('on');render();$('err').textContent='送信に失敗しました。通信環境を確認して、もう一度「回答を送信して採点する」を押してください。（'+e.message+'）';$('err').classList.add('on')});
  }
  function result(d){
    var ok=d.results.filter(function(r){return r.ok}).length,ng=d.results.length-ok;
    $('score').className='score '+(d.pass?'pass':'fail');
    $('rwho').textContent=st.name+' さん｜'+Q[st.test].title;
    $('rv').innerHTML=d.score+'<span>/ '+d.max+'点</span>';
    $('rbadge').textContent=d.pass?'合格':'不合格';
    $('rmsg').textContent=d.pass?'全問正解です。お疲れさまでした！':'満点で合格です。下の解説で間違えた問題を確認して、もう一度チャレンジしましょう。';
    $('rok').textContent=ok;$('rng').textContent=ng;
    var html='',order=d.results.map(function(r,i){return [r,i]});
    var wrong=order.filter(function(x){return !x[0].ok}),right=order.filter(function(x){return x[0].ok});
    if(wrong.length){html+='<p class="sec ng">間違えた問題（'+wrong.length+'問）</p>';wrong.forEach(function(x){html+=card(x[0],x[1])})}
    if(right.length){html+='<p class="sec ok">正解した問題（'+right.length+'問）</p>';right.forEach(function(x){html+=card(x[0],x[1])})}
    $('rlist').innerHTML=html;show('v-result');scrollTo({top:0});
  }
  function card(r,i){
    var li=r.c.map(function(c,ci){var cls=ci===r.correct?'c':(ci===r.your?'y':'');var tg=ci===r.correct?'<span class="tg">正解</span>':(ci===r.your?'<span class="tg">あなたの回答</span>':'');if(ci===r.correct&&ci===r.your)tg='<span class="tg">正解・あなたの回答</span>';
      return '<li class="'+cls+'"><span class="k">'+K[ci]+'</span><span>'+esc(c)+'</span>'+tg+'</li>'}).join('');
    return '<div class="rv '+(r.ok?'ok':'ng')+'"><div class="h"><span class="mk">'+(r.ok?'○':'×')+'</span><p class="qt"><small>Q'+String(i+1).padStart(2,'0')+'</small>'+esc(r.q)+'</p></div><ul>'+li+'</ul><p class="ex"><b>解説　</b>'+esc(r.e)+'</p></div>';
  }
  $('retry').onclick=function(){begin()};
  $('home').onclick=function(){show('v-intro');scrollTo({top:0})};
  function show(id){[].forEach.call(document.querySelectorAll('.view'),function(v){v.classList.toggle('on',v.id===id)})}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
})();
</script>
</body>
</html>
